[package]
name = "trader-sender-tpu"
description = "Direct TPU/QUIC sender: leader-aware fan-out over QUIC with pre-warmed connections (unstaked)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
trader-domain = { workspace = true }
trader-router = { workspace = true }
trader-market-data = { workspace = true }
solana-pubkey = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }

[dev-dependencies]
tokio = { workspace = true }
