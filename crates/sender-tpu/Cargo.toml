[package]
name = "trader-sender-tpu"
description = "Direct TPU/QUIC sender. The Yellowstone Jet integration is behind the `jet` feature (not built by default)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Enables yellowstone-jet-tpu-client 0.8.1 (Apache-2.0). Not compiled/tested in
# the default build; see docs/RPC_AND_ROUTING.md.
jet = []

[dependencies]
trader-domain = { workspace = true }
trader-router = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
