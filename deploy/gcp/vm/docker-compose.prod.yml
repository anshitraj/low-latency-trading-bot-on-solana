# Production-ish single VM: Postgres (local, private) + trader-api.
# Caddy runs on the host (TLS via Let's Encrypt) and proxies :443 -> 127.0.0.1:8080.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: trader
    volumes: [/opt/trader/pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trader"]
      interval: 5s
      retries: 20
    restart: unless-stopped
    logging: { driver: local, options: { max-size: "20m", max-file: "3" } }
  api:
    image: ${TRADER_IMAGE:-trader-api:latest}
    depends_on: { postgres: { condition: service_healthy } }
    env_file: [/run/trader/env]
    environment:
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: info,sqlx=warn
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped
    stop_grace_period: 30s
    logging: { driver: local, options: { max-size: "50m", max-file: "5" } }
